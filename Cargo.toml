[package]
name = "cabinote"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "cn"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
yaml-rust2 = { version = "0.13.0", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
