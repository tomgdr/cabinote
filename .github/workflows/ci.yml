name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --locked
      - name: Smoke test
        shell: bash
        run: |
          cargo run --locked -q -- --version
          cargo run --locked -q -- --help
      - name: Clippy
        run: cargo clippy --locked -- -D warnings
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
